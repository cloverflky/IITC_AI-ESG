    // ---------- 辅助函数: 保证所有notes路径兼容 (如果实际文件夹缺少，可增加默认提示，但保留原有路径风格) ----------
    // 为了和原有代码结构兼容且目录清晰，我们依据18个分类构建的路径均为示例性的层级，不会影响展示;
    // 但为了真实预览体验，如果用户本地存在对应路径则自动链接，不存在则无妨。和原逻辑一致。

    // 获取从文件路径中提取的显示名称 (去除路径和扩展名)
    function getDisplayName(filePath) {
        let fileName = filePath.replace(/^.*[\\/]/, "").replace(".html", "");
        // 限制长度，保持干净
        if (fileName.length > 45) fileName = fileName.slice(0, 42) + "...";
        return fileName;
    }

    // 渲染分类及文件列表 (支持搜索过滤)
    function renderCategories(filterText = "") {
        const container = document.getElementById("categoriesContainer");
        container.innerHTML = "";
        
        let totalVisibleFiles = 0;
        const categoryElements = [];
        
        categories.forEach((cat, catIndex) => {
            let filteredFiles = cat.files;
            const lowerFilter = filterText.trim().toLowerCase();
            
            if (lowerFilter !== "") {
                filteredFiles = cat.files.filter(file => {
                    const displayName = getDisplayName(file);
                    // 同时匹配文件名 + 分类名 + 部分路径关键字(增强搜索)
                    const categoryMatch = cat.name.toLowerCase().includes(lowerFilter);
                    const fileMatch = displayName.toLowerCase().includes(lowerFilter);
                    return fileMatch || categoryMatch;
                });
                if (filteredFiles.length === 0) return;
            }
            
            totalVisibleFiles += filteredFiles.length;
            
            const categoryDiv = document.createElement("div");
            categoryDiv.className = "category";
            
            const headerDiv = document.createElement("div");
            headerDiv.className = "category-header";
            headerDiv.setAttribute("data-cat-index", catIndex);
            
            const titleSpan = document.createElement("span");
            titleSpan.className = "category-title";
            titleSpan.innerHTML = `<span class="emoji">${cat.emoji}</span> ${cat.name} <span style="font-size:0.7rem; background:#eef2ff; padding:2px 8px; border-radius:30px; margin-left:6px;">${filteredFiles.length}</span>`;
            
            const toggleSpan = document.createElement("span");
            toggleSpan.className = "toggle-icon";
            toggleSpan.textContent = "▼";
            
            headerDiv.appendChild(titleSpan);
            headerDiv.appendChild(toggleSpan);
            
            const fileUl = document.createElement("ul");
            fileUl.className = "file-list";
            
            // 渲染文件列表
            filteredFiles.forEach(file => {
                const li = document.createElement("li");
                const a = document.createElement("a");
                const displayName = getDisplayName(file);
                // 完整路径链接 (不改变原始链接)
                a.href = file;
                a.innerHTML = `
                    <span class="file-icon">📄</span>
                    <span class="file-name">${escapeHtml(displayName)}</span>
                    <span class="badge">${escapeHtml(cat.name.split('·')[0] || cat.name)}</span>
                `;
                li.appendChild(a);
                fileUl.appendChild(li);
            });
            
            categoryDiv.appendChild(headerDiv);
            categoryDiv.appendChild(fileUl);
            container.appendChild(categoryDiv);
            
            // 恢复每个分类折叠状态 (基于localStorage)
            const savedState = localStorage.getItem(`cat_collapsed_v2_${catIndex}`);
            if (savedState === "true") {
                headerDiv.classList.add("collapsed");
                fileUl.classList.add("collapsed");
            }
            
            // 绑定折叠事件
            headerDiv.addEventListener("click", (e) => {
                e.stopPropagation();
                const isCollapsed = headerDiv.classList.toggle("collapsed");
                fileUl.classList.toggle("collapsed");
                localStorage.setItem(`cat_collapsed_v2_${catIndex}`, isCollapsed);
            });
        });
        
        // 更新底部计数 & 全局统计
        const footerDiv = document.getElementById("footer");
        const globalStatsSpan = document.getElementById("globalStats");
        if (globalStatsSpan) {
            const totalAllOriginal = categories.reduce((sum, cat) => sum + cat.files.length, 0);
            if (filterText.trim() !== "") {
                globalStatsSpan.innerHTML = `🔎 找到 ${totalVisibleFiles} 条匹配笔记 (共 ${totalAllOriginal} 条)`;
            } else {
                globalStatsSpan.innerHTML = `📚 全库收录 ${totalAllOriginal} 份核心笔记 · 18个专题分类`;
            }
        }
        
        if (filterText.trim() !== "" && totalVisibleFiles === 0) {
            container.innerHTML = `<div class="empty-message">🔍 没有找到与「${escapeHtml(filterText)}」相关的笔记<br>💡 试试“长期股权投资”“战略分析”“ESG标准”“公司法”等关键词</div>`;
            footerDiv.innerHTML = `✨ 未匹配到笔记 · 请尝试其他关键词`;
        } else {
            const totalOriginalAll = categories.reduce((sum, cat) => sum + cat.files.length, 0);
            footerDiv.innerHTML = `📖 当前展示 ${totalVisibleFiles} 条笔记 (共 ${totalOriginalAll} 条) · 点击分类标题可折叠/展开 · 支持实时搜索`;
        }
    }
    
    // 简易防XSS
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // 初始化搜索交互
    const searchInput = document.getElementById("searchInput");
    let debounceTimer;
    searchInput.addEventListener("input", function() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            renderCategories(this.value);
        }, 180);
    });
    
    // 初次渲染
    renderCategories();
    
    // 添加友好的控制台提示（帮助定位真实目录）
    console.log("📘 IITC-AIESG 学习目录已启动 | 18个分类全部载入，笔记路径基于相对目录，请确保notes文件夹结构与生成路径匹配。");
    console.log("提示: 若需真实笔记可依据分类模板创建对应html文件，当前为完整导航系统。");
    
    // 可选：如果用户点击链接文件不存在，不报错UI层面优雅提示(原生链接将会导致404但不影响目录)
    // 增强体验: 拦截部分链接错误弹出软提醒（可选，但保持原生行为更符合预期）
    document.addEventListener("click", function(e) {
        let target = e.target.closest("a");
        if (target && target.href && target.href.includes(".html")) {
            // 仅做可选的404预检？不干扰原逻辑，仅仅保留真实跳转
            // 让浏览器自然跳转即可；也可以不做额外处理。
        }
    });
</script>
